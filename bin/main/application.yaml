# 사용자 정의 설정 정보
app:
  name: My Demo App
  version: 1.0.0   
# mode: local      
  cors:
    allowed-origins:
      - https://a.com
      - https://b.com
  metadata:
    owner: ops
    region: ap-northeast-2
  admins: ["alice", "bob"]
  timeout: 30s
  max-upload: 25MB
  mode: PRO

# 서비스 포트
server:
  port: 8080

# 애플리케이션 이름
spring:
  application:
    name: demo
  profiles:
    active: dev
  # datasource:
  #   url: jdbc:h2:mem:skaladb
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password: 
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude:
        - beans
#       - metrics
  info:
    # 정적 애플리케이션 정보를 액츄에이터 info를 통해 읽어오도록
    # Spring Boot 환경에 있는 프로퍼티를 읽어오는 EnvInfoContributor를 활성화
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true

  endpoint:
    env:
      show-values: always
    health:
      show-details: always
  
# 정적 애플리케이션 정보
# /actuator/info 호출 시 보여줄 고정 정보
info:
  app:
    name: "주문 Service"
    version: "1.2.4"
    description: "주문 서비스 API"
    author: "홍길동"
db:
  url: jdbc:mysql://localhost:3306/demo
  username: root
  password: "password"
  pool-size: 10

